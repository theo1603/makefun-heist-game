<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Meridian Heist — a stealth game</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <canvas id="game" width="1280" height="800"></canvas>
  <footer>
    <strong>The Meridian Heist</strong> — steal the Aurora Diamond from three museum rooms
    and reach the getaway van.
    WASD / arrows move &middot; Shift sprints (loud) &middot; E cracks the vault case &middot;
    Click / 1 throws a decoy coin &middot; Right-click / 2 drops smoke &middot; P pauses
  </footer>
</main>
<script type="module" src="src/main.js"></script>
</body>
